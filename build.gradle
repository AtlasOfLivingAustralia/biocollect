buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
    }
    dependencies {
        classpath "org.apache.grails:grails-gradle-plugins:$grailsVersion"
        classpath "cloud.wondrify:asset-pipeline-gradle:$assetPipelineVersion"
        classpath "cloud.wondrify:sass-dart-asset-pipeline:$assetPipelineVersion"
        classpath 'com.bmuschko:gradle-clover-plugin:3.0.1'
        classpath "gradle.plugin.com.github.william-hill-online:wiremock-gradle-plugin:0.4.3"
        classpath "com.github.tomakehurst:wiremock-jre8-standalone:2.28.0"
    }
}

plugins {
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
}

version "$biocollectVersion"
group "au.org.ala"

apply plugin: "eclipse"
apply plugin: "idea"
apply plugin: "war"
apply plugin: "groovy"
apply plugin: "org.apache.grails.gradle.grails-web"
apply plugin: "cloud.wondrify.asset-pipeline"
apply plugin: "org.apache.grails.gradle.grails-gsp"
apply plugin: "com.github.william-hill-online.wiremock"

if (Boolean.valueOf(enableClover)) {
    apply from: "${project.projectDir}/gradle/clover.gradle"
}
apply from: "${project.projectDir}/gradle/publish.gradle"

sourceCompatibility = '17'
targetCompatibility = '17'
repositories {
    mavenLocal {
        // ~/.m2 has the ehcache pom without the jakarta classifier jar, which breaks
        // resolution of org.ehcache:ehcache:3.10.8:jakarta; force it to Maven Central
        content { excludeGroup 'org.ehcache' }
    }
    //for missing jai_core.jar
    //maven { url "https://mvnrepository.com" }
    maven { url "https://repo.osgeo.org/repository/release/" }
    maven { url "https://repo.grails.org/grails/core" }
    maven { url = uri("https://maven.pkg.github.com/atlasoflivingaustralia/ecodata-client-plugin")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv('GITHUB_ACTOR')
            password = project.findProperty("gpr.token") ?: System.getenv('GITHUB_TOKEN')
        }
    }
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://nexus.ala.org.au/content/repositories/snapshots" }
    mavenCentral()
}

// Groovy 4 artifacts moved from org.codehaus.groovy to org.apache.groovy.
// Old transitive requests (http-builder, GPars) are retargeted here; the Grails BOM
// constraints then upgrade them to the managed Groovy 4 version.
configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        // groovy-bom is exempt: retargeting it to org.apache.groovy:groovy-bom turns a
        // pom-only module into a platform-only module, which breaks library resolution
        if (details.requested.group == 'org.codehaus.groovy' && details.requested.name != 'groovy-bom') {
            details.useTarget(group: 'org.apache.groovy', name: details.requested.name, version: details.requested.version)
            details.because 'Groovy 4 coordinates moved to org.apache.groovy'
        }
    }
}

dependencies {
    implementation "org.apache.grails:grails-databinding"
    implementation "org.apache.grails:grails-gsp"
    developmentOnly("org.springframework.boot:spring-boot-devtools")
    developmentOnly "net.java.dev.jna:jna"
    developmentOnly "io.methvin:directory-watcher"
    console "org.apache.grails:grails-console"
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.apache.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.apache.grails:grails-logging"
    implementation "org.apache.grails:grails-web-boot"
    implementation "org.apache.grails:grails-rest-transforms"
    implementation "org.apache.grails:grails-services"
    implementation "org.apache.grails:grails-url-mappings"
    implementation "org.apache.grails:grails-interceptors"
    // Sitemesh 2 layout support moved out of grails-gsp into its own plugin in Grails 7
    implementation "org.apache.grails:grails-layout"
    implementation "org.apache.grails:grails-cache"
    // JCache/Ehcache 3 wiring (replaces the discontinued cache-ehcache plugin).
    // Configured via spring.cache.jcache.config in application.yml (biocollect-ehcache.xml).
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "javax.cache:cache-api:1.1.1"
    implementation("org.ehcache:ehcache:3.10.8:jakarta") {
        // the jakarta classifier jar must not drag in the javax JAXB stack from the default pom
        exclude group: 'javax.xml.bind'
        exclude group: 'org.glassfish.jaxb'
    }
    runtimeOnly "jakarta.xml.bind:jakarta.xml.bind-api:4.0.2"
    runtimeOnly "org.glassfish.jaxb:jaxb-runtime:4.0.5"
    implementation "org.apache.grails:grails-async"
    implementation "org.apache.grails.async:grails-async-gpars"
    profile "org.apache.grails.profiles:web"
    implementation "com.nimbusds:nimbus-jose-jwt:9.40"
    implementation ("org.grails.plugins:ala-auth:$alaSecurityLibsVersion")
    implementation "org.grails.plugins:ala-ws-security-plugin:$alaSecurityLibsVersion"
    implementation ("org.grails.plugins:ala-ws-plugin:$alaSecurityLibsVersion")
    implementation "au.org.ala:userdetails-service-client:$alaSecurityLibsVersion"
    implementation "cloud.wondrify:asset-pipeline-core:$assetPipelineVersion"
    implementation "cloud.wondrify:asset-pipeline-grails:$assetPipelineVersion"
    implementation "cloud.wondrify:sass-dart-asset-pipeline:$assetPipelineVersion"
    implementation "com.github.ben-manes.caffeine:caffeine:2.9.3"
    // POI 5.2.5 needs commons-io >= 2.7 (UnsynchronizedByteArrayOutputStream)
    implementation "commons-io:commons-io:2.14.0"
    implementation "com.drewnoakes:metadata-extractor:${metadataExtractorVersion}"
    implementation "org.imgscalr:imgscalr-lib:${imgscalrVersion}"
    implementation "org.apache.httpcomponents:httpmime:${httpmimeVersion}"
    implementation "com.vividsolutions:jts:${jtsVersion}"

    implementation "org.geotools.xsd:gt-xsd-kml:${geoToolsVersion}"
    implementation "org.geotools:gt-shapefile:${geoToolsVersion}"
    implementation "org.geotools:gt-geojson:${geoToolsVersion}"
    implementation "org.geotools:gt-epsg-hsql:${geoToolsVersion}"

    implementation "joda-time:joda-time:2.3"

    implementation 'com.opencsv:opencsv:5.7.0'
    implementation "org.apache.httpcomponents:httpclient:4.5.7"
    runtimeOnly 'org.webjars:jquery:1.12.4'
    // dk.glasius:external-config removed: external configuration (grails.config.locations)
    // is built into Grails core as of Grails 7.0.
    implementation 'org.grails.plugins:grails-mail:5.0.3'
    implementation "org.commonmark:commonmark:0.24.0"
    implementation "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20240325.1"

    //ALA plugins
    implementation("au.org.ala.plugins.grails:images-client-plugin:2.0-SNAPSHOT") {
        // ala-auth is provided by BioCollect directly (8.0.0-SNAPSHOT); avoid a duplicate.
        // commons-httpclient is intentionally kept: the plugin's *WebService classes use it at runtime.
        exclude group: 'org.grails.plugins', module: 'ala-auth'
    }

    // Apache POI (consolidated; also replaces the discontinued excel-import/excel-export plugins)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation "org.grails.plugins:ala-admin-plugin:3.0.0-SNAPSHOT"
    runtimeOnly "org.grails.plugins:ala-bootstrap5:2.0.0-SNAPSHOT"

    //    swagger API
    // openapi 2.0.0-SNAPSHOT is the Grails 7 / Jakarta build. The older 1.3.0 was a Grails 4-era
    // plugin whose controller was compiled against javax.servlet and which dragged in the entire
    // Grails 4.0.x framework (duplicate plugin descriptors that made plugin discovery hang).
    implementation 'au.org.ala.plugins:openapi:2.0.0-SNAPSHOT'
    // BioCollect controllers use io.swagger.v3.oas.annotations.* directly. openapi 2.0.0 scopes
    // swagger as an implementation detail (not exposed transitively), so declare it here.
    implementation "io.swagger.core.v3:swagger-annotations:2.2.23"

    implementation "org.codehaus.groovy.modules.http-builder:http-builder:0.7.1"
    implementation 'au.org.ala:ala-cas-client:4.0.0-SNAPSHOT'
    runtimeOnly("org.springframework.boot:spring-boot-properties-migrator")
    implementation 'org.apache.groovy:groovy-dateutil'
    if (!Boolean.valueOf(inplace)) {
        implementation "org.grails.plugins:ala-map-plugin:6.0-SNAPSHOT"
        implementation "org.grails.plugins:ecodata-client-plugin:10.0-SNAPSHOT"
    }

    testImplementation "org.pac4j:pac4j-jwt:5.4.3"
    testImplementation "org.mockito:mockito-core"
    testImplementation "org.apache.grails:grails-testing-support-web"
    testImplementation "org.apache.grails:grails-geb"
    testImplementation "com.github.tomakehurst:wiremock-jre8-standalone:2.28.0"
    testImplementation "org.seleniumhq.selenium:selenium-remote-driver:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-api:$seleniumVersion"
    testImplementation "org.seleniumhq.selenium:selenium-support:$seleniumVersion"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
    testRuntimeOnly "org.seleniumhq.selenium:selenium-firefox-driver:$seleniumVersion"
}

springBoot {
    buildInfo()
}

bootRun {
    jvmArgs(
            '-Dspring.output.ansi.enabled=always',
            '-XX:TieredStopAtLevel=1',
            '-Xmx2048m')
    sourceResources sourceSets.main
    String springProfilesActive = 'spring.profiles.active'
    systemProperty springProfilesActive, System.getProperty(springProfilesActive)
}

bootJar {
    enabled = true
    archiveClassifier = 'exec'
    launchScript()
}

assets {
    minifyJs = true
    minifyCss = true
    maxThreads = 4
    minifyOptions = [
            languageMode  : 'ES6', //languageIn
//            targetLanguage: 'ES5', // languageOut
            excludes: ['sw.js', '**/*.min.js', 'ckeditor/ckeditor5/**', '**/webjars/**']
    ]

    includes = []
    // Exclude HTML: demo/example pages (esp. webjars) are not served assets, and HtmlProcessor
    // crashes on quoted '%' (e.g. leaflet.markercluster progress bar: ... + '%').
    // Knockout templates under assets/components/template are compiled to JS by _events.groovy.
    excludes = ["**/*.scss", "**/*.html", '**/build/hintrc.js', 'hintrc.unminified.js', '**/spec.hintrc.js', 'spec.hintrc.unminified.js', 'node_modules/**']
}

if (Boolean.valueOf(inplace)) {
    grails {
        plugins {
            implementation(project(':ecodata-client-plugin'))
            implementation(project(':ala-map-plugin'))
        }
    }

    // Make ecodata-client-plugin _Events task is called
    assetCompile.dependsOn("ecodata-client-plugin:_Events")
    compileGroovy.dependsOn("ecodata-client-plugin:_Events")
    bootRun.dependsOn("ecodata-client-plugin:_Events")

    // The plugin subprojects each ship their own Application/bootRun so they can be run
    // standalone. When included inplace, an unqualified `bootRun` would otherwise also try
    // to start them (they crash: no CAS config, no UrlMappingsHolder). Only BioCollect
    // should be booted, so disable the plugins' boot run tasks here.
    ['ecodata-client-plugin', 'ala-map-plugin'].each { pluginName ->
        project(":$pluginName").tasks
                .matching { it.name in ['bootRun', 'bootTestRun'] }
                .configureEach { enabled = false }
    }
}

task _Events {
    doLast {
        println "Running biocollect _events.groovy script"
        println "${project.projectDir}/_events.groovy"
        new GroovyScriptEngine(["${project.projectDir}"] as String[]).run("_events.groovy", new Binding(['projectDir': project.projectDir]))
    }
}

// the tasks used here for dependsOn may be incomplete/incorrect
assetCompile.dependsOn(_Events)
compileGroovy.dependsOn(_Events)
bootRun.dependsOn(_Events)


tasks.withType(GroovyCompile) {
    configure(groovyOptions) {
        forkOptions.jvmArgs = ['-Xmx1024m']
    }
}

tasks.withType(Test) {
    useJUnitPlatform()
}

tasks.withType(Test) {
    systemProperty "geb.env", System.getProperty('geb.env')
    systemProperty "geb.build.reportsDir", reporting.file("geb/integrationTest")
    systemProperty 'webdriver.chrome.driver', System.getProperty('webdriver.chrome.driver')
    systemProperty 'webdriver.gecko.driver', System.getProperty('webdriver.gecko.driver')
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams true
    }
}

wiremock {
    dir "${project.projectDir}/src/integration-test/resources/wiremock/"
    params "--port=8018 --global-response-templating --local-response-templating"
//    params "--port=8018 --global-response-templating --local-response-templating --verbose --print-all-network-traffic --record-mappings"
}
