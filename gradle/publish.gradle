apply plugin: 'maven-publish'

publishing {
    repositories {
        maven {
            name = 'Nexus'
            url = uri("https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases'}")
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }

    publications {
        mavenJar(MavenPublication) {
            artifact tasks.named('bootJar')
            pom {
                // Explicit jar packaging (Maven default); avoids a pom-only publication.
                packaging = 'jar'
            }
        }
    }
}

// Module metadata describes component variants, not a fat executable. Disable it for this publication.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}
